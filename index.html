<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiPath — Solver Modules</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="op-logo-wrap" style="padding-top: 1.2rem;">
                <div style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: transparent; border: 1px solid rgba(55,53,47,0.4); border-radius: 4px; font-size: 12px; color: rgba(55,53,47,0.6);">🌐</div>
                <div class="op-logo-name" style="font-weight: 600;">OptiPath Inc.</div>
            </div>
            
            <div class="nav-links" style="padding-top: 0.5rem;">
                <a href="#" class="nav-item active" id="nav-dashboard"><span style="margin-right: 8px; opacity: 0.6;">🏠</span> Home</a>
            </div>

            <span class="op-nav-label">Teamspaces</span>
            
            <div class="nav-links">
                <a href="#" class="nav-item" id="nav-hungarian"><span style="margin-right: 8px;">🏢</span> Assignment Model</a>
                <a href="#" class="nav-item" id="nav-cpm"><span style="margin-right: 8px;">📈</span> Project Scheduling</a>
            </div>
            
            <div style="margin-top: auto; padding: 1rem; border-top: 1px solid rgba(55,53,47,0.09);">
                <p style="font-size: 11px; color: rgba(55,53,47,0.5); text-align: left;">OptiPath</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="op-topbar">
                <div style="display: flex; align-items: center; gap: 0.8rem; font-size: 14px; color: #37352F;">
                    <span style="opacity: 0.5;">OptiPath</span> 
                    <span style="opacity: 0.3;">/</span> 
                    <span id="topbar-breadcrumb" style="font-weight: 500;">Dashboard</span>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="font-size: 13px; font-weight: 500; color: rgba(55, 53, 47, 0.65);" id="api-status">API Backend: Disconnected 🔴</span>
                    <span style="opacity: 0.6;">Share</span>
                    <span style="opacity: 0.6;">💬</span>
                    <span style="opacity: 0.6;">⏱️</span>
                    <span style="opacity: 0.6;">⭐</span>
                    <span style="opacity: 0.6;">•••</span>
                </div>
            </div>
            
            <div class="content-inner" id="module-container">
                <!-- Content will be injected here by JS -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
