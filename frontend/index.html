<!DOCTYPE html>
<html lang="id">
<head>
    <!-- ── Meta & Charset ─────────────────────────────────────────────────── -->
    <!-- Charset UTF-8: mendukung karakter Bahasa Indonesia dan simbol Unicode -->
    <meta charset="UTF-8">
    <!-- Viewport: memastikan tampilan responsif di berbagai ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Judul halaman: ditampilkan di tab browser dan digunakan mesin pencari (SEO) -->
    <title>OptiPath — Solver Modules</title>

    <!-- ── Stylesheet Utama ───────────────────────────────────────────────── -->
    <!-- styles.css: seluruh gaya visual aplikasi (Notion-style design system) -->
    <link rel="stylesheet" href="styles.css">

    <!-- ── Library Eksternal ──────────────────────────────────────────────── -->
    <!-- Plotly.js: library visualisasi grafik (disiapkan untuk fitur ekspansi) -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <!-- Vis.js Network: library untuk render graf jaringan CPM secara interaktif -->
    <!-- Digunakan oleh modul CPM untuk menampilkan diagram jaringan dengan node & edge -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

    <!-- ================================================================
         LAYOUT UTAMA APLIKASI
         Struktur dua kolom: Sidebar (kiri) + Main Content (kanan).
         Diimplementasikan dengan CSS Flexbox (class .app-container).
         ================================================================ -->
    <div class="app-container">

        <!-- ── SIDEBAR: Panel Navigasi Kiri ──────────────────────────────── -->
        <!-- Berisi logo aplikasi, label navigasi, dan item menu antar modul.  -->
        <!-- Lebar tetap 240px (lihat .sidebar di styles.css).                 -->
        <aside class="sidebar">

            <!-- Logo Aplikasi: ikon bola dunia + nama "OptiPath Inc." -->
            <div class="op-logo-wrap" style="padding-top: 1.2rem;">
                <div style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: transparent; border: 1px solid rgba(55,53,47,0.4); border-radius: 4px; font-size: 12px; color: rgba(55,53,47,0.6);">🌐</div>
                <div class="op-logo-name" style="font-weight: 600;">OptiPath Inc.</div>
            </div>
            
            <!-- Navigasi: Home / Dashboard -->
            <!-- nav-dashboard: tombol kembali ke halaman beranda -->
            <div class="nav-links" style="padding-top: 0.5rem;">
                <a href="#" class="nav-item active" id="nav-dashboard"><span style="margin-right: 8px; opacity: 1;">🏠</span> Home</a>
            </div>

            <!-- Label grup navigasi "Teamspaces" (Notion-style section header) -->
            <span class="op-nav-label">Teamspaces</span>
            
            <!-- Navigasi Modul Utama: Hungarian & CPM -->
            <!-- nav-hungarian: modul Metode Penugasan (Hungarian Algorithm)  -->
            <!-- nav-cpm      : modul Teori Jaringan (Critical Path Method)   -->
            <!-- Klik pada nav-item memicu renderHungarian() / renderCpm() di script.js -->
            <div class="nav-links">
                <a href="#" class="nav-item" id="nav-hungarian"><span style="margin-right: 8px;">🏢</span> Metode Penugasan</a>
                <a href="#" class="nav-item" id="nav-cpm"><span style="margin-right: 8px;">📈</span> Teori Jaringan</a>
            </div>
            
            <!-- Footer Sidebar: versi atau info tambahan -->
            <div style="margin-top: auto; padding: 1rem; border-top: 1px solid rgba(55,53,47,0.09);">
                <p style="font-size: 11px; color: rgba(55,53,47,0.5); text-align: left;">OptiPath</p>
            </div>
        </aside>

        <!-- ── MAIN CONTENT: Area Konten Utama ───────────────────────────── -->
        <!-- Mengisi sisa ruang (flex: 1), mendukung scroll vertikal.          -->
        <!-- Seluruh konten modul diinjeksi secara dinamis ke #module-container -->
        <!-- oleh JavaScript (Single Page Application pattern).                -->
        <main class="main-content">

            <!-- ── Top App Bar ──────────────────────────────────────────── -->
            <!-- Bar navigasi atas: sticky di bagian atas saat scroll.        -->
            <!-- Berisi: breadcrumb lokasi aktif + status koneksi API backend. -->
            <div class="op-topbar">
                <!-- Breadcrumb: OptiPath / [Nama Modul Aktif] -->
                <!-- #topbar-breadcrumb diperbarui oleh JS saat modul berganti -->
                <div style="display: flex; align-items: center; gap: 0.8rem; font-size: 14px; color: #37352F;">
                    <span style="opacity: 0.5;">OptiPath</span> 
                    <span style="opacity: 0.3;">/</span> 
                    <span id="topbar-breadcrumb" style="font-weight: 500;">Dashboard</span>
                </div>

                <!-- Status & Aksi Kanan: indikator API + ikon toolbar -->
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <!-- #api-status: diperbarui oleh JS berdasarkan hasil fetch ke API -->
                    <!-- Hijau 🟢 = terhubung, Merah 🔴 = terputus                       -->
                    <span style="font-size: 13px; font-weight: 500; color: rgba(55, 53, 47, 0.65);" id="api-status">API Backend: Disconnected 🔴</span>
                    <!-- Ikon toolbar (Share, Comment, History, Star, More) — dekoratif Notion-style -->
                    <span style="opacity: 0.6;">Share</span>
                    <span style="opacity: 0.6;">💬</span>
                    <span style="opacity: 0.6;">⏱️</span>
                    <span style="opacity: 0.6;">⭐</span>
                    <span style="opacity: 0.6;">•••</span>
                </div>
            </div>
            
            <!-- ── Module Container ─────────────────────────────────────── -->
            <!-- Area konten utama yang diisi secara dinamis oleh JavaScript. -->
            <!-- Fungsi renderDashboard(), renderHungarian(), renderCpm()     -->
            <!-- di script.js akan menyuntikkan HTML ke dalam elemen ini.     -->
            <!-- Animasi fadeInUp (dari styles.css) diaktifkan saat konten    -->
            <!-- baru diinjeksi melalui class .content-inner.                 -->
            <div class="content-inner" id="module-container">
                <!-- Konten modul akan diinjeksi di sini oleh script.js -->
            </div>
        </main>
    </div>

    <!-- ── Script Utama ───────────────────────────────────────────────────── -->
    <!-- script.js: logika frontend SPA (Single Page Application).            -->
    <!-- Dimuat di akhir body agar DOM sudah siap sebelum script dieksekusi.  -->
    <!-- Berisi: event listener navigasi, setup matriks, komunikasi API,      -->
    <!--         rendering langkah Hungarian, dan visualisasi CPM via Vis.js. -->
    <script src="script.js"></script>
</body>
</html>
